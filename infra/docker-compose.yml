name: trading-copilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading_copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_copilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-trading_copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - trading-copilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_copilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - trading-copilot-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trading-copilot-postgres-data:
  trading-copilot-redis-data:
